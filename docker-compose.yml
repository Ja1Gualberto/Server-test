services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: mc-otherworld
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"
      MEMORY: "8G"
      ONLINE_MODE: "FALSE"
      ENABLE_AUTOPAUSE: "FALSE"
      USE_AIKAR_FLAGS: "TRUE"
      MOTD: "Otherworld [D&D] Server"
      MAX_PLAYERS: "20"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "6"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: mc-playit
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./playit_data:/etc/playit
    depends_on:
      - minecraft
